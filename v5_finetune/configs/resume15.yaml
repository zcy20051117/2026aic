schema_version: 1
project_root: ${AIC_PROJECT_ROOT}/v5_finetune
seed: 42
data:
  images_dir: ${AIC_DATA_ROOT}/train/images
  masks_dir: ${AIC_DATA_ROOT}/train/masks
  train_list: ${AIC_DATA_ROOT}/splits/v1/train.txt
  val_list: ${AIC_DATA_ROOT}/splits/v1/val.txt
  aic_selected_list: ${AIC_PROJECT_ROOT}/v5_finetune/manifests/aic_vehicle_top2500.txt
  loveda_root: ${LOVEDA_ROOT}
  loveda_rural_list: ${AIC_PROJECT_ROOT}/v5_finetune/manifests/loveda_rural.txt
  loveda_urban_list: ${AIC_PROJECT_ROOT}/v5_finetune/manifests/loveda_urban.txt
  image_size: 1024
  original_count: 5464
  aic_selected_count: 2500
  loveda_count: 2522
  train_count: 5022
  val_count: 1368
model:
  backbone: facebook/dinov3-vitl16-pretrain-lvd1689m
  backbone_weights: ${DINOV3_WEIGHTS}
  interaction_indexes: [4, 11, 17, 23]
  adapter_pretrain_size: 1024
  adapter_conv_inplane: 64
  adapter_deform_heads: 16
  adapter_drop_path: 0.0
  hidden_dim: 256
  mask_dim: 256
  conv_dim: 256
  pixel_decoder_encoder_layers: 6
  pixel_decoder_attention_heads: 8
  pixel_decoder_ffn_dim: 1024
  transformer_decoder_layers: 9
  transformer_decoder_attention_heads: 8
  transformer_decoder_ffn_dim: 2048
  num_queries: 100
  num_classes: 8
  common_stride: 4
  dropout: 0.0
loss:
