  crop_probability: 0.70
  small_crop_size: 512
  medium_crop_size: 768
sampling:
  barren_weighted: true
selection:
  barren_min_miou: 0.792
validation:
  batch_size: 1
  query_chunk: 20
  loss_seed: 20260918
